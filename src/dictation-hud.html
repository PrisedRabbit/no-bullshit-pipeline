<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBP Dictation</title>
  <style>
    /* Defaults = dark; body.dark / body.light are set from JS to match the app
       theme (auto/light/dark). Accent tracks the main window: purple on dark,
       blue on light. */
    :root, body.dark {
      --bg: rgba(20, 16, 34, 0.72);
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.55);
      --accent: #a855f7;
      --on-accent: #0b0614;
      --danger: #f87171;
      --ok: #4ade80;
      --stroke: rgba(255, 255, 255, 0.10);
      --shadow: rgba(0, 0, 0, 0.30);
    }
    body.light {
      --bg: rgba(255, 255, 255, 0.86);
      --text: #0f172a;
      --text-dim: rgba(15, 23, 42, 0.55);
      --accent: #3b82f6;
      --on-accent: #ffffff;
      --danger: #dc2626;
      --ok: #16a34a;
      --stroke: rgba(15, 23, 42, 0.12);
      --shadow: rgba(15, 23, 42, 0.18);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .hud {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 272px;
      box-sizing: border-box;
      /* Fixed height so the card doesn't shrink on the short idle states
         ("No audio detected" etc.) — keeps the HUD a stable size. */
      min-height: 84px;
      background: var(--bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 13px;
      /* Clip the backdrop-filter to the rounded corners — without overflow the
         blur paints a square, leaving a grey rectangle behind the rounded card
         (WebKit doesn't clip backdrop-filter to border-radius on its own). */
      overflow: hidden;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 0 0 1px var(--stroke) inset, 0 8px 24px var(--shadow);
      /* Whole card is grab-and-drag; interactive bits opt out via no-drag */
      -webkit-app-region: drag;
      cursor: grab;
    }
    .card:active { cursor: grabbing; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--accent);
    }
    .dot.recording {
      background: var(--danger);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot.processing {
      background: var(--accent);
      animation: pulse 0.8s ease-in-out infinite;
    }
    .dot.done {
      background: var(--ok);
    }
    .dot.error {
      background: var(--danger);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .status {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hint {
      font-size: 11px;
      color: var(--text-dim);
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .partial {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      line-height: 1.35;
      max-height: 4.05em; /* 3 lines */
      overflow: hidden;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .partial.visible { display: block; }
    .meter {
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      /* Meter is purely visual — keep drag enabled on top of it */
      -webkit-app-region: drag;
    }
    .bar {
      width: 4px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--accent), var(--danger));
      transition: height 80ms cubic-bezier(0.22, 1, 0.36, 1), opacity 120ms;
      opacity: 1;
    }
    .meter.flat .bar {
      height: 4px !important;
      opacity: 0.75 !important;
    }
    .spinner {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.12);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      -webkit-app-region: no-drag;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
    }
    .btn:hover { filter: brightness(1.1); }
    body { transition: opacity 300ms ease; }
    body.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body class="hidden">
  <div class="hud">
    <div class="card" id="card">
      <div class="row">
        <div class="dot" id="dot"></div>
        <div class="status" id="status">Listening…</div>
        <button class="btn" id="action-btn" style="display:none;">Fix</button>
      </div>
      <div class="meter" id="meter">
        <div class="bar" data-i="0"></div>
        <div class="bar" data-i="1"></div>
        <div class="bar" data-i="2"></div>
        <div class="bar" data-i="3"></div>
        <div class="bar" data-i="4"></div>
      </div>
      <div class="hint" id="hint">⌘⇧D again to stop</div>
      <div class="partial" id="partial"></div>
    </div>
  </div>
  <script type="module" src="dist/dictation-hud.js"></script>
</body>
</html>
