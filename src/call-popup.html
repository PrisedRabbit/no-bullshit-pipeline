<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBP Call</title>
  <style>
    /* Theme palette — mirrors `src/styles.css` body classes. Trinary
       system: Dark (body.dark) is the default, Light (body.light) overrides,
       Auto is resolved in JS to either dark or light based on
       `prefers-color-scheme`. :root holds the Dark palette as fallback so
       a missing body class never renders unstyled. */
    :root {
      --bg: #15102e;
      --bg-elev: #1e1740;
      --text: #f5f5f7;
      --text-dim: rgba(245, 245, 247, 0.6);
      --accent: #a855f7;
      --ok: #4ade80;
      --danger: #f87171;
      --track: rgba(255, 255, 255, 0.08);
    }
    body.light {
      --bg: #ffffff;
      --bg-elev: #f1f5f9;
      --text: #0f172a;
      --text-dim: rgba(15, 23, 42, 0.6);
      --accent: #3b82f6;
      --track: rgba(15, 23, 42, 0.08);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .popup {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 320px;
      background: var(--bg);
      border-radius: 14px;
      padding: 12px 14px 0 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06) inset,
        0 10px 30px rgba(0, 0, 0, 0.35);
      cursor: grab;
      overflow: hidden;
    }
    .card:active { cursor: grabbing; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text-dim);
    }
    .dot.recording { background: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
    .dot.saved     { background: var(--ok); }
    .dot.error     { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .msg {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .app {
      font-size: 11px;
      color: var(--text-dim);
      font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    }
    .actions {
      display: none;
      gap: 8px;
      padding-bottom: 10px;
    }
    body.show-actions .actions { display: flex; }
    .btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: var(--bg-elev);
      color: var(--text);
    }
    /* Countdown bar at the bottom of the card — visualizes how long the
       user has left to click Ignore. JS drives the width animation so it
       restarts cleanly on each new popup show. */
    .progress-track {
      display: none;
      height: 3px;
      background: var(--track);
      margin: 0 -14px;
    }
    body.show-actions .progress-track { display: block; }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
    }
    body {
      opacity: 0;
      transition: opacity 180ms ease;
    }
    body.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="popup">
    <div class="card" id="card">
      <div class="row">
        <div class="dot" id="dot"></div>
        <div class="msg" id="msg">Call</div>
        <div class="app" id="app"></div>
      </div>
      <div class="actions" id="actions">
        <button class="btn btn-secondary" id="ignore-btn">Ignore</button>
      </div>
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>
  </div>
  <script type="module" src="dist/call-popup.js"></script>
</body>
</html>
