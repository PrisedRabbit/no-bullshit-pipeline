# FSM - Machine Contract
# CONSTANT. Never updated at runtime.
# Human edit only (version bump = new release)

phases:
  idle:
    transitions:
      - to: brief
        trigger: input/brief.md exists

  brief:
    skill: /hltm-brief
    transitions:
      - to: planning

  planning:
    skill: /hltm-planning
    transitions:
      - to: solutioning

  solutioning:
    skill: /hltm-solutioning
    transitions:
      - to: readiness

  readiness:
    skill: /hltm-readiness
    transitions:
      - to: sprint-prep
        condition: pass
      - to: solutioning
        condition: fail

  sprint-prep:
    skill: /hltm-sprint-prep
    transitions:
      - to: implementation

  implementation:
    # No single skill — router maps step to sub-skill.
    # See implementation-routing.md
    sub-skills:
      develop: /hltm-impl-develop
      testing: /hltm-impl-testing
      code-review: /hltm-impl-code-review
    transitions:
      - to: retro
        trigger: all_done

  retro:
    skill: /hltm-retro
    transitions:
      - to: idle

# Validation rule:
# Any transition not listed here → STOP
