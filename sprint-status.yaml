  - description: "Async pipeline execution may block UI"
    mitigation: "Use background tasks with progress events"
    probability: medium
    impact: medium

# Success Criteria
success_criteria:
  - "User can define pipelines via JSON with llm/save/webhook connectors"
  - "Pipelines execute sequentially when transcript available"
  - "All step outputs written as markdown files with frontmatter"
  - "Pipeline status (waiting/running/done/partial) tracked correctly"
  - "Prompt templates can be created and used in llm steps"
  - "Existing transcripts migrated to frontmatter format"

