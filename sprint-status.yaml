    description: "JSON-based pipeline and step schema with validation"

  - id: "5.2"
    title: "Built-in Connector - LLM"
    status: planned
    priority: critical
    estimate: 5
    description: "Process content with AI prompts via OpenAI/Google/Anthropic"

  - id: "5.3"
    title: "Built-in Connector - Save"
    status: planned
    priority: high
    estimate: 2
    description: "Save step outputs to filesystem with path variables"

  - id: "5.4"
    title: "Built-in Connector - Webhook"
    status: planned
    priority: high
    estimate: 3
    description: "POST step outputs to HTTP endpoints"

  - id: "5.6"
    title: "Pipeline Execution Engine"
    status: planned
    priority: critical
    estimate: 5
    description: "Sequential step execution with status tracking and auto-triggering"

  - id: "5.7"
    title: "Prompt Template Registry"
    status: planned
