[package]
name = "nbp"
version = "0.3.0"
description = "A Tauri App"
authors = ["sk"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nbp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
# System Audio Capture (Core Audio Taps)
cidre = { git = "https://github.com/yury/cidre", branch = "main", features = ["av"] }
ringbuf = "0.4.8"
anyhow = "1.0"
ebur128 = "0.1"
vorbis_rs = "0.3"
lewton = "0.10"
rubato = "0.15"
log = "0.4"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls", "stream"] }
futures-util = "0.3.31"
tokio = { version = "1.49.0", features = ["fs", "io-util"] }
whisper-rs = { version = "0.12", features = ["metal"] }

